<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Elo Solidário</title>

    <link rel="stylesheet" href="../CSS/styles.css">
</head>

<body>

    <header>

        <img
            src="../IMAGENS/Logo-Elo-Solidario.png"
            alt="Logo da Elo Solidário"
            width="150"
            height="150"
        >

        <h1>Elo Solidário.</h1>

        <!-- Controle do menu hambúrguer -->
        <input
            type="checkbox"
            id="menu-toggle"
            class="menu-toggle"
        >

        <label
            for="menu-toggle"
            class="menu-hamburguer"
        >
            <span aria-hidden="true">☰</span>
            <span class="sr-only">Abrir ou fechar menu de navegação</span>
        </label>

        <nav aria-label="Navegação principal">

            <ul class="menu-principal">

                <li>
                    <a href="index.html">Início</a>
                </li>

                <li class="menu-dropdown">

                    <a href="projetos.html">Projetos</a>

                    <ul class="submenu">

                        <li>
                            <a href="projetos.html#doacoes">
                                Doações
                            </a>
                        </li>

                        <li>
                            <a href="projetos.html#voluntariado">
                                Voluntariado
                            </a>
                        </li>

                    </ul>

                </li>

                <li>
                    <a href="cadastro.html">Cadastro</a>
                </li>

            </ul>

        </nav>

    </header>


    <main>

        <section>

            <h2>Cadastro de Usuário</h2>

            <p>
                Preencha os dados abaixo para fazer parte da Elo Solidário.
                Os campos são obrigatórios para concluir o cadastro.
            </p>

            <form>

                <!-- DADOS PESSOAIS -->

                <fieldset>

                    <legend>Dados Pessoais</legend>

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        minlength="3"
                        autocomplete="name"
                        required
                    >


                    <label for="data">
                        Data de nascimento
                    </label>

                    <input
                        type="date"
                        id="data"
                        name="data"
                        autocomplete="bday"
                        required
                    >


                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        title="Digite o CPF no formato 000.000.000-00"
                        inputmode="numeric"
                        required
                    >


                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@email.com"
                        autocomplete="email"
                        required
                    >


                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(11) 99999-9999"
                        maxlength="15"
                        pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                        title="Digite o telefone no formato (11) 99999-9999"
                        autocomplete="tel"
                        inputmode="tel"
                        required
                    >

                </fieldset>


                <!-- ENDEREÇO -->

                <fieldset>

                    <legend>Endereço</legend>

                    <label for="rua">
                        Rua
                    </label>

                    <input
                        type="text"
                        id="rua"
                        name="rua"
                        placeholder="Digite o nome da rua"
                        autocomplete="street-address"
                        required
                    >


                    <label for="numero">
                        Número
                    </label>

                    <input
                        type="text"
                        id="numero"
                        name="numero"
                        placeholder="Ex: 123"
                        inputmode="numeric"
                        required
                    >


                    <label for="bairro">
                        Bairro
                    </label>

                    <input
                        type="text"
                        id="bairro"
                        name="bairro"
                        placeholder="Digite seu bairro"
                        required
                    >


                    <label for="cidade">
                        Cidade
                    </label>

                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        placeholder="Digite sua cidade"
                        autocomplete="address-level2"
                        required
                    >


                    <label for="estado">
                        Estado
                    </label>

                    <input
                        type="text"
                        id="estado"
                        name="estado"
                        placeholder="Ex: SP"
                        maxlength="2"
                        pattern="[A-Za-z]{2}"
                        title="Digite a sigla do estado com duas letras, como SP"
                        autocomplete="address-level1"
                        required
                    >


                    <label for="cep">
                        CEP
                    </label>

                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="00000-000"
                        maxlength="9"
                        pattern="[0-9]{5}-[0-9]{3}"
                        title="Digite o CEP no formato 00000-000"
                        autocomplete="postal-code"
                        inputmode="numeric"
                        required
                    >

                </fieldset>


                <button type="submit">
                    Cadastrar
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2026 Elo Solidário. Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
